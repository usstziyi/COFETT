[project]
name = "cofett"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "usstziyi", email = "007lookworld@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "autoreject>=0.5.1",
    "matplotlib>=3.10.9",
    "mne>=1.6.0",
    "mne-icalabel>=0.10.0",
    "numpy>=1.26.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyprep==0.9.0",
    "scipy>=1.15.3",
    "torch>=2.14.1",
]

[project.scripts]
cofett = "cofett:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
